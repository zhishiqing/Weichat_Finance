<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酒店列表 · Hotel Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
.page { padding: var(--space-5) 0; max-width: 120rem; margin: 0 auto; }

.search-summary {
  background: var(--white);
  border-radius: var(--card-radius);
  padding: var(--space-4);
  margin: 0 var(--space-3) var(--space-4);
  box-shadow: var(--card-shadow);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-3);
}
.summary-info { font-size: 1.4rem; color: var(--text-black-soft); }
.summary-info strong { color: var(--starbucks-green); font-size: 1.6rem; }
.summary-sort { display: flex; gap: var(--space-2); align-items: center; }
.sort-chip {
  padding: 0.6rem 1.4rem;
  border-radius: var(--chip-radius);
  border: 1px solid var(--ceramic);
  font-size: 1.3rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  background: var(--white);
  color: var(--text-black);
}
.sort-chip:hover { border-color: var(--green-accent); }
.sort-chip.active { background: var(--green-accent); color: var(--white); border-color: var(--green-accent); }

.layout { display: grid; grid-template-columns: 24rem 1fr; gap: var(--space-4); padding: 0 var(--space-3); }

.filter-sidebar {
  background: var(--white);
  border-radius: var(--card-radius);
  padding: var(--space-4);
  box-shadow: var(--card-shadow);
  height: fit-content;
  position: sticky;
  top: 9.2rem;
}
.filter-group { margin-bottom: var(--space-4); }
.filter-group:last-child { margin-bottom: 0; }
.filter-title {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-black);
  margin-bottom: var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--ceramic);
}
.filter-option {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.6rem 0;
  cursor: pointer;
  font-size: 1.4rem;
  color: var(--text-black);
}
.filter-option:hover { color: var(--starbucks-green); }
.filter-option input[type="checkbox"] { width: 1.6rem; height: 1.6rem; accent-color: var(--green-accent); cursor: pointer; }
.filter-option .count { color: var(--text-black-soft); font-size: 1.2rem; margin-left: auto; }

.hotel-list { display: flex; flex-direction: column; gap: var(--space-3); }
.list-card {
  background: var(--white);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  overflow: hidden;
  display: grid;
  grid-template-columns: 32rem 1fr;
  cursor: pointer;
  transition: all 0.3s ease;
}
.list-card:hover { transform: translateY(-2px); box-shadow: var(--hover-shadow); }
.list-card:active { transform: scale(0.99); }
.list-cover { width: 100%; height: 28rem; object-fit: cover; }
.list-body { padding: var(--space-4); display: flex; flex-direction: column; }
.list-header { display: flex; justify-content: space-between; align-items: start; gap: var(--space-3); margin-bottom: var(--space-2); }
.list-name { font-size: 2rem; font-weight: 600; color: var(--text-black); line-height: 1.3; }
.list-name-en { font-size: 1.2rem; color: var(--text-black-soft); font-weight: 400; margin-top: 4px; }
.list-stars { color: var(--gold); font-size: 1.4rem; flex-shrink: 0; }
.list-district { font-size: 1.3rem; color: var(--text-black-soft); margin-bottom: var(--space-2); display: flex; align-items: center; gap: 0.4rem; }
.list-tags { display: flex; gap: var(--space-1); flex-wrap: wrap; margin-bottom: var(--space-3); }
.list-tag {
  font-size: 1.1rem; padding: 2px 8px;
  background: var(--green-light); color: var(--starbucks-green);
  border-radius: 4px; font-weight: 500;
}
.list-room-preview {
  font-size: 1.3rem;
  color: var(--text-black-soft);
  margin-bottom: var(--space-3);
  padding: var(--space-2) 0;
  border-top: 1px dashed var(--ceramic);
  border-bottom: 1px dashed var(--ceramic);
}
.list-room-preview strong { color: var(--text-black); }
.list-bottom { display: flex; justify-content: space-between; align-items: end; margin-top: auto; }
.list-score-box {
  background: var(--green-accent);
  color: var(--white);
  padding: 0.6rem 1rem;
  border-radius: 8px;
  text-align: center;
}
.list-score-num { font-size: 2rem; font-weight: 700; line-height: 1.1; }
.list-score-label { font-size: 1.1rem; opacity: 0.9; }
.list-reviews { font-size: 1.2rem; color: var(--text-black-soft); margin-top: 0.4rem; text-align: center; }
.list-price { text-align: right; }
.list-old-price { font-size: 1.3rem; color: var(--text-black-soft); text-decoration: line-through; }
.list-now-price { font-size: 2.8rem; font-weight: 700; color: var(--starbucks-green); line-height: 1.1; }
.list-now-unit { font-size: 1.3rem; color: var(--text-black-soft); }
.list-discount { font-size: 1.1rem; color: var(--red); margin-top: 0.2rem; }

.empty-state { padding: var(--space-7) var(--space-3); text-align: center; color: var(--text-black-soft); }

@media (max-width: 1024px) { .layout { grid-template-columns: 1fr; } .filter-sidebar { position: static; } }
@media (max-width: 768px) {
  .layout { padding: 0 var(--space-3); }
  .list-card { grid-template-columns: 1fr; }
  .list-cover { height: 18rem; }
}
</style>
</head>
<body>

<div id="nav-slot"></div>

<main class="page">
  <!-- 搜索摘要 -->
  <div class="search-summary">
    <div class="summary-info">
      <strong id="resultCount">0</strong> 家酒店 · <span id="searchCity">上海</span> · 9月16日 - 9月17日 · 1晚 · 2成人
    </div>
    <div class="summary-sort" id="sortBar"></div>
  </div>

  <div class="layout">
    <!-- 筛选侧栏 -->
    <aside class="filter-sidebar">
      <div class="filter-group">
        <div class="filter-title">价格区间</div>
        <label class="filter-option"><input type="checkbox" name="price" value="0-500">¥0-500<span class="count">12</span></label>
        <label class="filter-option"><input type="checkbox" name="price" value="500-1000">¥500-1000<span class="count">28</span></label>
        <label class="filter-option"><input type="checkbox" name="price" value="1000-2000">¥1000-2000<span class="count">45</span></label>
        <label class="filter-option"><input type="checkbox" name="price" value="2000+">¥2000+<span class="count">22</span></label>
      </div>

      <div class="filter-group">
        <div class="filter-title">星级</div>
        <label class="filter-option"><input type="checkbox" name="star" value="5">★★★★★<span class="count">32</span></label>
        <label class="filter-option"><input type="checkbox" name="star" value="4">★★★★<span class="count">48</span></label>
        <label class="filter-option"><input type="checkbox" name="star" value="3">★★★<span class="count">27</span></label>
      </div>

      <div class="filter-group">
        <div class="filter-title">设施/标签</div>
        <label class="filter-option"><input type="checkbox" name="tag" value="免费取消">免费取消</label>
        <label class="filter-option"><input type="checkbox" name="tag" value="含早餐">含早餐</label>
        <label class="filter-option"><input type="checkbox" name="tag" value="江景/湖景">江景/湖景</label>
        <label class="filter-option"><input type="checkbox" name="tag" value="近地铁">近地铁</label>
      </div>
    </aside>

    <!-- 列表 -->
    <div class="hotel-list" id="hotelList"></div>
  </div>
</main>

<div id="footer-slot"></div>
<div id="frap-slot"></div>
<div id="toast-slot"></div>

<script src="assets/data.js"></script>
<script src="assets/components.js"></script>
<script>
mountCommon('list');

const params = new URLSearchParams(location.search);
const cityFilter = params.get('city') || '上海';
document.getElementById('searchCity').textContent = cityFilter;

let currentSort = 'recommend';

function getFiltered() {
  let list = HOTELS.filter(h => !cityFilter || h.city === cityFilter || h.district.includes(cityFilter) || cityFilter === '全部');
  // 简单筛选演示
  document.querySelectorAll('input[name="price"]:checked').forEach(cb => {
    const [min, max] = cb.value === '2000+' ? [2000, Infinity] : cb.value.split('-').map(Number);
    list = list.filter(h => h.price >= min && h.price <= max);
  });
  document.querySelectorAll('input[name="star"]:checked').forEach(cb => {
    list = list.filter(h => h.star === Number(cb.value));
  });
  // 排序
  if (currentSort === 'priceAsc') list.sort((a, b) => a.price - b.price);
  else if (currentSort === 'priceDesc') list.sort((a, b) => b.price - a.price);
  else if (currentSort === 'scoreDesc') list.sort((a, b) => b.score - a.score);
  return list;
}

function renderList() {
  const list = getFiltered();
  document.getElementById('resultCount').textContent = list.length;
  document.getElementById('hotelList').innerHTML = list.length === 0
    ? '<div class="empty-state">没有匹配的酒店<br><br><button class="btn-outline" onclick="resetFilter()">重置筛选条件</button></div>'
    : list.map(h => `
        <a href="detail.html?id=${h.id}" class="list-card">
          <img class="list-cover" src="${h.cover}" alt="${h.nameCn}" onerror="this.style.background='linear-gradient(135deg,var(--ceramic),var(--neutral-warm))'">
          <div class="list-body">
            <div class="list-header">
              <div>
                <div class="list-name">${h.nameCn}</div>
                <div class="list-name-en">${h.nameEn} · ${h.address}</div>
              </div>
              <div class="list-stars">${'★'.repeat(h.star)}</div>
            </div>
            <div class="list-district">📍 ${h.district}</div>
            <div class="list-tags">
              ${h.tags.slice(0, 4).map(t => `<span class="list-tag">${t}</span>`).join('')}
            </div>
            <div class="list-room-preview">
              <strong>${h.rooms[0].type}</strong> · ${h.rooms[0].bed} · ${h.rooms[0].area} · ${h.rooms[0].cancel}
            </div>
            <div class="list-bottom">
              <div>
                <div class="list-score-box">
                  <div class="list-score-num">${h.score}</div>
                  <div class="list-score-label">/10 棒极了</div>
                </div>
                <div class="list-reviews">${h.reviewCount} 条评价</div>
              </div>
              <div class="list-price">
                <div class="list-old-price">¥${h.oldPrice}</div>
                <div><span class="list-now-price">¥${h.price}</span><span class="list-now-unit">/晚起</span></div>
                <div class="list-discount">立减 ¥${h.oldPrice - h.price}</div>
              </div>
            </div>
          </div>
        </a>
      `).join('');
}

document.getElementById('sortBar').innerHTML = FILTERS.sortOptions.map(s =>
  `<button class="sort-chip ${s.key === currentSort ? 'active' : ''}" onclick="setSort('${s.key}')">${s.label}</button>`
).join('');

function setSort(k) {
  currentSort = k;
  document.querySelectorAll('.sort-chip').forEach(c => c.classList.toggle('active', c.textContent.includes(labelFor(k))));
  renderList();
}
function labelFor(k) {
  const s = FILTERS.sortOptions.find(o => o.key === k);
  return s ? s.label : '';
}

document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.addEventListener('change', renderList));

function resetFilter() {
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
  renderList();
}

renderList();
</script>

</body>
</html>
