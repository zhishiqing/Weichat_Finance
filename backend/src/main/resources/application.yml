# ============================================================
# Weichat_Finance · 主配置
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: weichat-finance

  # ---- 数据库（连本地 Docker MySQL 容器）----
  datasource:
    url: jdbc:mysql://localhost:3306/weichat_finance?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: WeichatFinanceHikari
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  # ---- Flyway 数据库迁移 ----
  flyway:
    enabled: true
    baseline-on-migrate: true         # 已有库的兜底
    locations: classpath:db/migration  # 迁移脚本位置
    encoding: UTF-8
    table: flyway_schema_history

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 下划线字段映射驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发期打印 SQL
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: is_deleted   # 全局逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.weichat.finance: DEBUG
    com.baomidou.mybatisplus: INFO
  pattern:
    # 日志格式：[时间] [级别] [线程] [traceId] [类名] - 消息
    #   %X{traceId:-}：从 MDC 取 traceId，没有则输出 -（避免日志模板异常）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"

# ---- 自定义业务配置（占位）----
weichat:
  finance:
    # v1.0 默认直连商户
    default-mch-id: PLACEHOLDER_MCH_ID

# ---- 调度任务配置 ----
# pay-order-query：定时查单兜底（解决回调丢失导致的悬挂单）
#   interval-ms：执行间隔（默认 30 分钟）
#   initial-delay-ms：首次延迟（默认 60 秒，避开启动高峰期）
#
# 选择 30 分钟的考虑：
#   - 微信订单有效期 2 小时，30 分钟兜底足够及时发现问题
#   - 不会对微信接口造成过大压力
#   - 如果需要临时验证调度任务，可改为 10000（10 秒）
scheduler:
  pay-order-query:
    interval-ms: 1800000        # 30 分钟（生产环境）
    initial-delay-ms: 60000     # 60 秒
  reconciliation:
    cron: "0 0 3 * * ?"         # 每日 03:00 执行对账（避开次日 04:00 前账单未生成）

# ---- Knife4j / Swagger 增强配置 ----
# Spring Boot 3 + Jakarta EE 9 适配
knife4j:
  enable: true                       # 启用 Knife4j（生产环境设为 false）
  setting:
    language: zh_cn                  # 中文界面
    enable-version: true             # 文档多版本切换（顶部 tab）
    enable-swagger-models: true      # 左侧显示 Model 列表
    swagger-model-name: 实体类列表
  basic:
    enable: false                    # 关闭 Knife4j 自带 Basic 认证（开发期不需要）
    username: admin
    password: admin

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs               # OpenAPI JSON 路径
  swagger-ui:
    enabled: true
    path: /swagger-ui.html           # 原生 Swagger UI 路径
  default-flat-param-object: true    # 扁平化参数对象，便于表单调试

# ---- 微信支付配置（Phase 2）----
# mode=MOCK（默认）：本地开发，零风险，返回伪造 prepay_id
# mode=REAL：调用微信支付 V3 真实接口（需提供真实商户凭证）
wechatpay:
  mode: ${WX_PAY_MODE:MOCK}
  merchant:
    mch-id: ${WX_MCH_ID:PLACEHOLDER_MCH_ID}
    app-id: ${WX_APP_ID:PLACEHOLDER_APP_ID}
    api-v3-key: ${WX_API_V3_KEY:PLACEHOLDER_32_CHARS_API_V3_KEY________}
    cert:
      serial-no: ${WX_CERT_SERIAL_NO:PLACEHOLDER_CERT_SERIAL}
      private-key-path: ${WX_CERT_PRIVATE_KEY_PATH:certs/apiclient_key.pem}
  notify-url-base: ${WX_NOTIFY_URL_BASE:http://localhost:8080/api}
